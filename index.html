<!DOCTYPE html>
<html lang="zh-TW">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>我的點數</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

    <link
        rel="manifest"
        href="manifest.json"
    >

</head>


<body>


    <main>


        <!-- =====================================================
             第一頁：總覽
        ====================================================== -->

        <section
            id="page-home"
            class="page active"
        >


            <!-- 目前點數 -->

            <div class="points-area">

                <div class="section-title">
                    目前點數
                </div>


                <div class="total-points">

                    <span id="totalPoints">
                        0
                    </span>

                    <span class="point-unit">
                        點
                    </span>

                </div>

            </div>



            <!-- 獎勵兌換處 -->

            <div class="goal-area">

                <div class="section-title">
                    獎勵兌換處
                </div>


                <div id="goalList">

                    <!--
                    JavaScript 自動產生：

                    地瓜球    3 點    兌換
                    泡麵     10 點    兌換
                    -->

                </div>

            </div>



            <!-- 匯出紀錄 -->

            <button
                id="backupButton"
                class="backup-button"
                type="button"
            >
                匯出紀錄
            </button>


        </section>





        <!-- =====================================================
             第二頁：加分
        ====================================================== -->

        <section
            id="page-add"
            class="page"
        >


            <!-- 今日進度 -->

            <div class="section-title">
                今日進度
            </div>


            <div class="daily-progress">

                <span class="progress-light"></span>

                <span class="progress-light"></span>

                <span class="progress-light"></span>

                <span class="progress-light"></span>

                <span class="progress-light"></span>

            </div>



            <!-- 加分選項 -->

            <div class="section-title add-title">
                加分選項
            </div>


            <div id="taskList">

                <!--
                JavaScript 自動產生：

                讀書30分鐘        +1
                洗衣服            +1
                曬衣服            +1
                -->

            </div>



            <!-- 取消上一筆 -->

            <button
                id="undoButton"
                class="undo-button"
                type="button"
            >

                <span>
                    取消上一筆
                </span>

                <span>
                    -1
                </span>

            </button>


        </section>





        <!-- =====================================================
             第三頁：管理
        ====================================================== -->

        <section
            id="page-manage"
            class="page"
        >


            <!-- =================================================
                 獎勵
            ================================================== -->

            <div class="manage-section">


                <div class="manage-main-title">
                    獎勵
                </div>



                <!-- 新增獎勵 -->

                <div class="manage-subsection">

                    <div class="manage-subtitle">
                        新增獎勵
                    </div>


                    <div class="form-area">


                        <label for="goalName">
                            獎勵名稱
                        </label>


                        <input
                            type="text"
                            id="goalName"
                            placeholder="輸入獎勵名稱"
                            autocomplete="off"
                        >



                        <label for="goalPoints">
                            所需點數
                        </label>


                        <input
                            type="number"
                            id="goalPoints"
                            placeholder="輸入點數"
                            min="1"
                            inputmode="numeric"
                        >



                        <button
                            id="addGoalButton"
                            type="button"
                        >
                            新增
                        </button>


                    </div>

                </div>



                <!-- 管理現有獎勵 -->

                <div class="manage-subsection">

                    <div class="manage-subtitle">
                        管理現有獎勵
                    </div>


                    <div class="delete-control">


                        <select
                            id="goalDeleteSelect"
                            class="manage-select"
                        >

                            <option value="">
                                請選擇獎勵
                            </option>

                        </select>


                        <button
                            id="deleteGoalButton"
                            class="delete-manage-button"
                            type="button"
                            disabled
                        >
                            刪除
                        </button>


                    </div>

                </div>


            </div>





            <!-- =================================================
                 加分事項
            ================================================== -->

            <div class="manage-section">


                <div class="manage-main-title">
                    加分事項
                </div>



                <!-- 新增加分事項 -->

                <div class="manage-subsection">

                    <div class="manage-subtitle">
                        新增加分事項
                    </div>


                    <div class="form-area">


                        <label for="taskName">
                            事項名稱
                        </label>


                        <input
                            type="text"
                            id="taskName"
                            placeholder="輸入事項名稱"
                            autocomplete="off"
                        >



                        <button
                            id="addTaskButton"
                            type="button"
                        >
                            新增
                        </button>


                    </div>

                </div>



                <!-- 管理現有加分事項 -->

                <div class="manage-subsection">

                    <div class="manage-subtitle">
                        管理現有加分事項
                    </div>


                    <div class="delete-control">


                        <select
                            id="taskDeleteSelect"
                            class="manage-select"
                        >

                            <option value="">
                                請選擇加分事項
                            </option>

                        </select>


                        <button
                            id="deleteTaskButton"
                            class="delete-manage-button"
                            type="button"
                            disabled
                        >
                            刪除
                        </button>


                    </div>

                </div>


            </div>


        </section>





        <!-- =====================================================
             第四頁：紀錄
        ====================================================== -->

        <section
            id="page-record"
            class="page"
        >


            <!-- 上一週 / 下一週 -->

            <div class="week-navigation">


                <button
                    id="previousWeek"
                    type="button"
                >
                    上一週
                </button>


                <button
                    id="nextWeek"
                    type="button"
                >
                    下一週
                </button>


            </div>



            <!-- 本週紀錄 -->

            <div class="section-title">
                本週紀錄
            </div>


            <div
                id="weekRange"
                class="week-range"
            >
            </div>



            <!-- 每週內容 -->

            <div id="weeklyRecord">

                <!--
                JavaScript 自動產生：

                星期一

                讀書30分鐘          +1
                洗衣服              +1

                星期二

                無紀錄


                如果是兌換：

                兌換：地瓜球        -3    撤銷
                -->

            </div>


        </section>


    </main>





    <!-- =====================================================
         底部導覽列
    ====================================================== -->

    <nav class="bottom-nav">


        <button
            class="nav-button active"
            data-page="home"
            type="button"
        >
            總覽
        </button>


        <button
            class="nav-button"
            data-page="add"
            type="button"
        >
            加分
        </button>


        <button
            class="nav-button"
            data-page="manage"
            type="button"
        >
            管理
        </button>


        <button
            class="nav-button"
            data-page="record"
            type="button"
        >
            紀錄
        </button>


    </nav>



    <!-- =====================================================
         JavaScript
    ====================================================== -->

    <script src="app.js"></script>


</body>

</html>
