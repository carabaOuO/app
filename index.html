<!DOCTYPE html>
<html lang="zh-TW">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>我的點數</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

    <link
        rel="manifest"
        href="manifest.json"
    >

</head>


<body>


    <main>


        <!-- =====================================================
             第一頁：總覽
        ====================================================== -->

        <section
            id="page-home"
            class="page active"
        >


            <!-- =========================
                 目前點數
            ========================== -->

            <div class="points-area">

                <div class="section-title">
                    目前點數
                </div>


                <div class="total-points">

                    <span id="totalPoints">
                        0
                    </span>

                    <span class="point-unit">
                        點
                    </span>

                </div>

            </div>



            <!-- =========================
                 今日功績
            ========================== -->

            <div class="achievement-area">


                <!--
                今天有功績時才會顯示
                -->

                <div
                    id="achievementDisplay"
                    class="achievement-display"
                    hidden
                >

                    <div class="section-title achievement-title">
                        今日功績
                    </div>


                    <div id="achievementList">
                    </div>

                </div>



                <!--
                尚未新增：
                ＋ 新增今日功績

                已經有功績：
                ＋ 再新增一件
                -->

                <button
                    id="openAchievementFormButton"
                    class="open-achievement-button"
                    type="button"
                >
                    ＋ 新增今日功績
                </button>



                <!-- 今日功績輸入區 -->

                <div
                    id="achievementForm"
                    class="achievement-form"
                    hidden
                >

                    <label for="achievementInput">
                        今天做了什麼值得肯定的事？
                    </label>


                    <input
                        type="text"
                        id="achievementInput"
                        placeholder="輸入今天做到的事"
                        autocomplete="off"
                    >


                    <div class="achievement-form-actions">

                        <button
                            id="cancelAchievementButton"
                            class="achievement-cancel-button"
                            type="button"
                        >
                            取消
                        </button>


                        <button
                            id="addAchievementButton"
                            class="achievement-add-button"
                            type="button"
                        >
                            +1
                        </button>

                    </div>

                </div>


            </div>



            <!-- =========================
                 獎勵兌換處
            ========================== -->

            <div class="goal-area">

                <div class="section-title">
                    獎勵兌換處
                </div>


                <div id="goalList">
                </div>

            </div>



            <!-- =========================
                 匯出紀錄
            ========================== -->

            <button
                id="backupButton"
                class="backup-button"
                type="button"
            >
                匯出紀錄
            </button>


        </section>





        <!-- =====================================================
             第二頁：加分
        ====================================================== -->

        <section
            id="page-add"
            class="page"
        >


            <!-- =========================
                 今日進度
            ========================== -->

            <div class="section-title">
                今日進度
            </div>


            <div class="daily-progress">

                <span class="progress-light"></span>

                <span class="progress-light"></span>

                <span class="progress-light"></span>

                <span class="progress-light"></span>

                <span class="progress-light"></span>

            </div>



            <!-- =========================
                 今日短期任務
            ========================== -->

            <div
                id="shortTaskSection"
                class="short-task-section"
                hidden
            >

                <div class="section-title short-task-title">
                    短期任務
                </div>


                <div id="shortTaskList">
                </div>

            </div>



            <!-- =========================
                 固定加分事項
            ========================== -->

            <div class="section-title add-title">
                加分選項
            </div>


            <div id="taskList">
            </div>



            <!-- =========================
                 取消上一筆
            ========================== -->

            <button
                id="undoButton"
                class="undo-button"
                type="button"
            >

                <span>
                    取消上一筆
                </span>

                <span>
                    -1
                </span>

            </button>


        </section>





        <!-- =====================================================
             第三頁：管理
        ====================================================== -->

        <section
            id="page-manage"
            class="page"
        >


            <!-- =================================================
                 摺疊一：獎勵
            ================================================== -->

            <div class="manage-accordion-section">


                <button
                    id="manageGoalToggle"
                    class="manage-accordion-toggle"
                    type="button"
                    aria-expanded="false"
                    aria-controls="manageGoalContent"
                >
                    獎勵
                </button>



                <div
                    id="manageGoalContent"
                    class="manage-accordion-content"
                    hidden
                >


                    <!-- 新增獎勵 -->

                    <div class="manage-subsection">

                        <div class="manage-subtitle">
                            新增獎勵
                        </div>


                        <div class="form-area">


                            <label for="goalName">
                                獎勵名稱
                            </label>


                            <input
                                type="text"
                                id="goalName"
                                placeholder="輸入獎勵名稱"
                                autocomplete="off"
                            >



                            <label for="goalPoints">
                                所需點數
                            </label>


                            <input
                                type="number"
                                id="goalPoints"
                                placeholder="輸入點數"
                                min="1"
                                inputmode="numeric"
                            >



                            <button
                                id="addGoalButton"
                                type="button"
                            >
                                新增
                            </button>


                        </div>

                    </div>



                    <!-- 管理現有獎勵 -->

                    <div class="manage-subsection">

                        <div class="manage-subtitle">
                            管理現有獎勵
                        </div>


                        <div class="delete-control">


                            <select
                                id="goalDeleteSelect"
                                class="manage-select"
                            >

                                <option value="">
                                    請選擇獎勵
                                </option>

                            </select>


                            <button
                                id="deleteGoalButton"
                                class="delete-manage-button"
                                type="button"
                                disabled
                            >
                                刪除
                            </button>


                        </div>

                    </div>


                </div>


            </div>





            <!-- =================================================
                 摺疊二：加分事項
            ================================================== -->

            <div class="manage-accordion-section">


                <button
                    id="manageTaskToggle"
                    class="manage-accordion-toggle"
                    type="button"
                    aria-expanded="false"
                    aria-controls="manageTaskContent"
                >
                    加分事項
                </button>



                <div
                    id="manageTaskContent"
                    class="manage-accordion-content"
                    hidden
                >


                    <!-- 新增加分事項 -->

                    <div class="manage-subsection">

                        <div class="manage-subtitle">
                            新增加分事項
                        </div>


                        <div class="form-area">


                            <label for="taskName">
                                事項名稱
                            </label>


                            <input
                                type="text"
                                id="taskName"
                                placeholder="輸入事項名稱"
                                autocomplete="off"
                            >



                            <button
                                id="addTaskButton"
                                type="button"
                            >
                                新增
                            </button>


                        </div>

                    </div>



                    <!-- 管理現有加分事項 -->

                    <div class="manage-subsection">

                        <div class="manage-subtitle">
                            管理現有加分事項
                        </div>


                        <div class="delete-control">


                            <select
                                id="taskDeleteSelect"
                                class="manage-select"
                            >

                                <option value="">
                                    請選擇加分事項
                                </option>

                            </select>


                            <button
                                id="deleteTaskButton"
                                class="delete-manage-button"
                                type="button"
                                disabled
                            >
                                刪除
                            </button>


                        </div>

                    </div>


                </div>


            </div>





            <!-- =================================================
                 摺疊三：短期任務
            ================================================== -->

            <div class="manage-accordion-section">


                <button
                    id="manageShortTaskToggle"
                    class="manage-accordion-toggle"
                    type="button"
                    aria-expanded="false"
                    aria-controls="manageShortTaskContent"
                >
                    短期任務
                </button>



                <div
                    id="manageShortTaskContent"
                    class="manage-accordion-content"
                    hidden
                >


                    <!-- 新增短期任務 -->

                    <div class="manage-subsection">

                        <div class="manage-subtitle">
                            新增短期任務
                        </div>


                        <div class="form-area">


                            <label for="shortTaskName">
                                任務名稱
                            </label>


                            <input
                                type="text"
                                id="shortTaskName"
                                placeholder="例如：丟垃圾"
                                autocomplete="off"
                            >



                            <label for="shortTaskDate">
                                日期
                            </label>


                            <input
                                type="date"
                                id="shortTaskDate"
                            >



                            <button
                                id="addShortTaskButton"
                                type="button"
                            >
                                新增
                            </button>


                        </div>

                    </div>



                    <!-- 管理已安排任務 -->

                    <div class="manage-subsection">

                        <div class="manage-subtitle">
                            管理已安排任務
                        </div>


                        <div class="delete-control">


                            <select
                                id="shortTaskDeleteSelect"
                                class="manage-select"
                            >

                                <option value="">
                                    請選擇短期任務
                                </option>

                            </select>


                            <button
                                id="deleteShortTaskButton"
                                class="delete-manage-button"
                                type="button"
                                disabled
                            >
                                刪除
                            </button>


                        </div>

                    </div>


                </div>


            </div>


        </section>





        <!-- =====================================================
             第四頁：紀錄
        ====================================================== -->

        <section
            id="page-record"
            class="page"
        >


            <!-- =========================
                 上一週 / 下一週
            ========================== -->

            <div class="week-navigation">


                <button
                    id="previousWeek"
                    type="button"
                >
                    上一週
                </button>


                <button
                    id="nextWeek"
                    type="button"
                >
                    下一週
                </button>


            </div>



            <!-- =========================
                 本週紀錄
            ========================== -->

            <div class="section-title">
                本週紀錄
            </div>


            <div
                id="weekRange"
                class="week-range"
            >
            </div>


            <div id="weeklyRecord">
            </div>


        </section>


    </main>





    <!-- =====================================================
         底部導覽列
    ====================================================== -->

    <nav class="bottom-nav">


        <button
            class="nav-button active"
            data-page="home"
            type="button"
        >
            總覽
        </button>


        <button
            class="nav-button"
            data-page="add"
            type="button"
        >
            加分
        </button>


        <button
            class="nav-button"
            data-page="manage"
            type="button"
        >
            管理
        </button>


        <button
            class="nav-button"
            data-page="record"
            type="button"
        >
            紀錄
        </button>


    </nav>



    <!-- =====================================================
         JavaScript
    ====================================================== -->

    <script src="app.js"></script>


</body>

</html>
